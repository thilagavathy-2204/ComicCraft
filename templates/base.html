<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}ComicCraft{% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f1e8;
            color: #2d1b16;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: #8b4a35;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            color: #6f3023;
            font-size: 42px;
        }

        .lead {
            max-width: 700px;
            margin: auto;
            color: #665b55;
            line-height: 1.6;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .form-card {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 18px;
        }

        textarea,
        input,
        select {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #7b3828;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5c281d;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .info-card {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-card strong {
            color: #7b3828;
        }

        .info-card span {
            color: #665b55;
            line-height: 1.5;
        }

        @media (max-width: 800px) {
            .grid,
            .info-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>

</head>

<body>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
